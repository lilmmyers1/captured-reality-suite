<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captured Reality Suite</title>
<style>
/* ══════════════════════════════════════════════════════════════
   Captured Reality Suite — light, plain-spoken, tile-first.
   Built for people who don't live in software all day.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F4F6F5; --card:#FFFFFF; --sunk:#FAFBFA;
  --ink:#16211F; --ink2:#465451; --mute:#7C8A87; --faint:#A9B4B1;
  --line:#E4E9E7; --line2:#D2DAD8;
  --accent:#0E7C66; --accent-dk:#0A5F4E; --accent-soft:#E6F2EF;
  --ok:#157F52; --ok-soft:#E4F3EA;
  --warn:#A96C12; --warn-soft:#FBF0DC;
  --bad:#BE4438; --bad-soft:#FBE9E7;
  --info:#2C6E9B; --info-soft:#E6F0F7;
  --r:14px; --ease:cubic-bezier(.22,1,.36,1);
  --shadow:0 1px 2px rgba(22,33,31,.05), 0 4px 14px -6px rgba(22,33,31,.10);
  --shadow-lg:0 2px 4px rgba(22,33,31,.06), 0 16px 36px -12px rgba(22,33,31,.20);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#D3DBD9;border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#BCC7C4}
::-webkit-scrollbar-track{background:transparent}

/* ── sign in ───────────────────────────────────────────────── */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#EDF3F1 0%,#F6F8F7 55%,#F1F5F3 100%);padding:24px}
#login.hidden{display:none}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:38px 34px;box-shadow:var(--shadow-lg);animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.login-mark{width:52px;height:52px;border-radius:15px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  letter-spacing:-.03em;margin-bottom:20px}
.login-card h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px}
.login-card p.sub{font-size:14px;color:var(--mute);margin-bottom:26px}
.login-card label{margin-top:14px}
.login-card button.go{width:100%;margin-top:22px;padding:13px;background:var(--accent);color:#fff;
  border:0;border-radius:11px;font-size:15px;font-weight:650;cursor:pointer;
  transition:background .18s,transform .1s}
.login-card button.go:hover{background:var(--accent-dk)}
.login-card button.go:active{transform:scale(.99)}
.login-card button.go:disabled{opacity:.6;cursor:default}
.login-err{margin-top:14px;font-size:14px;color:var(--bad);min-height:20px}

/* ── shell ─────────────────────────────────────────────────── */
#app{display:none;min-height:100%;flex-direction:column}
#app.on{display:flex}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:0 26px;height:64px;background:var(--card);border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  letter-spacing:-.03em;flex-shrink:0}
.topbar .name{font-size:15px;font-weight:650;letter-spacing:-.01em;cursor:pointer}
.topbar .name span{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.topbar .sp{flex:1}
.homebtn{display:none;align-items:center;gap:7px;padding:8px 14px;background:var(--sunk);
  border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);
  cursor:pointer;transition:all .16s}
.homebtn.on{display:inline-flex}
.homebtn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dk)}
.userchip{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 6px;border-radius:10px;
  cursor:pointer;transition:background .16s}
.userchip:hover{background:var(--sunk)}
.av{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dk);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.userchip .u{font-size:13.5px;font-weight:600;line-height:1.2}
.userchip .u span{display:block;font-size:11.5px;color:var(--mute);font-weight:500}

main{flex:1;padding:30px 26px 70px;max-width:1320px;width:100%;margin:0 auto}

/* ── home ──────────────────────────────────────────────────── */
.hello{margin-bottom:8px;font-size:27px;font-weight:700;letter-spacing:-.025em}
.hello-sub{font-size:15px;color:var(--mute);margin-bottom:26px}

.alertbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:28px}
.alert{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:11px;
  font-size:13.5px;font-weight:550;border:1px solid transparent;cursor:pointer;transition:transform .12s}
.alert:hover{transform:translateY(-1px)}
.alert.bad{background:var(--bad-soft);color:var(--bad);border-color:#F3D4D0}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:#F0DFBE}
.alert.ok{background:var(--ok-soft);color:var(--ok);border-color:#CFE8D9}
.alert b{font-weight:750}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 22px 20px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.tile:active{transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:21px;margin-bottom:16px}
.tile .t{font-size:17px;font-weight:680;letter-spacing:-.015em;margin-bottom:3px}
.tile .n{font-size:13.5px;color:var(--mute)}
.tile .big{position:absolute;top:20px;right:22px;font-size:22px;font-weight:750;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.i-teal{background:var(--accent-soft);color:var(--accent-dk)}
.i-blue{background:var(--info-soft);color:var(--info)}
.i-amber{background:var(--warn-soft);color:var(--warn)}
.i-green{background:var(--ok-soft);color:var(--ok)}
.i-red{background:var(--bad-soft);color:var(--bad)}
.i-grey{background:#EEF1F0;color:var(--ink2)}

/* ── section pages ─────────────────────────────────────────── */
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.phead h1{font-size:25px;font-weight:700;letter-spacing:-.025em}
.phead p{font-size:14px;color:var(--mute);margin-top:3px}
.phead .sp{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:17px 22px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.card-h .cnt{font-size:13px;color:var(--mute);font-weight:500}
.card-h .sp{flex:1}
.card-b{padding:20px 22px}
.card-b.flush{padding:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;
  box-shadow:var(--shadow)}
.stat .l{font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:7px}
.stat .v{font-size:24px;font-weight:730;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .f{font-size:12.5px;color:var(--faint);margin-top:3px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.stat.warn .v{color:var(--warn)} .stat.teal .v{color:var(--accent)}

/* ── controls ──────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 17px;background:var(--accent);
  color:#fff;border:0;border-radius:10px;font-size:14.5px;font-weight:620;cursor:pointer;
  transition:background .16s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--accent-dk)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk);border-color:var(--accent);color:var(--accent-dk)}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn.danger{background:var(--card);border:1px solid #E9C4BF;color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.big{padding:13px 22px;font-size:15.5px;border-radius:12px}

label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
input,select,textarea{background:var(--card);border:1px solid var(--line2);border-radius:10px;
  padding:10px 12px;outline:none;width:100%;transition:border-color .16s,box-shadow .16s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle}
.field{margin-bottom:15px}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}

.bar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:15px 22px;
  border-bottom:1px solid var(--line);background:var(--sunk)}
.bar input,.bar select{width:auto;min-width:170px;background:var(--card)}
.bar .sp{flex:1}

/* ── tables ────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);padding:13px 20px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .13s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mut{color:var(--mute)}
.empty{padding:46px 24px;text-align:center;color:var(--mute);font-size:14.5px}
.empty .big{font-size:30px;margin-bottom:10px;opacity:.5}
.stack b{display:block;font-weight:640}
.stack span{display:block;font-size:12.5px;color:var(--mute)}

.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:650;
  white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:#CFE8D9}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:#F0DFBE}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:#F3D4D0}
.p-info{background:var(--info-soft);color:var(--info);border-color:#D0E2EF}
.p-mute{background:#EEF1F0;color:var(--ink2);border-color:#E1E6E4}
.p-teal{background:var(--accent-soft);color:var(--accent-dk);border-color:#C9E3DB}

.money{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.prog{height:7px;background:#EDF1EF;border-radius:5px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:5px}

/* ── modal ─────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;
  background:rgba(22,33,31,.42);backdrop-filter:blur(3px);overflow-y:auto;padding:40px 20px}
.modal.on{display:flex}
.modal-box{width:100%;max-width:640px;background:var(--card);border-radius:18px;
  box-shadow:var(--shadow-lg);animation:rise .26s var(--ease);overflow:hidden}
.modal-box.wide{max-width:980px}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:18px;font-weight:680;letter-spacing:-.02em}
.modal-h button{background:var(--sunk);border:1px solid var(--line);width:32px;height:32px;
  border-radius:9px;color:var(--mute);font-size:17px;cursor:pointer;line-height:1}
.modal-h button:hover{background:var(--bad-soft);color:var(--bad);border-color:#E9C4BF}
.modal-b{padding:22px 24px;max-height:calc(100vh - 240px);overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:17px 24px;
  border-top:1px solid var(--line);background:var(--sunk)}
.modal-f .sp{flex:1}

.sect{font-size:12.5px;font-weight:700;color:var(--accent-dk);letter-spacing:.04em;
  text-transform:uppercase;margin:24px 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sect:first-child{margin-top:0}

.dl{display:grid;grid-template-columns:170px 1fr;gap:11px 16px;font-size:14px}
.dl dt{color:var(--mute);font-weight:600;font-size:13px}
.dl dd{color:var(--ink)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:#fff;border-radius:12px;padding:13px 20px;font-size:14.5px;
  box-shadow:var(--shadow-lg);animation:pop .26s var(--ease);max-width:min(520px,92vw)}
@keyframes pop{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.err{background:var(--bad)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1000px){.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.g2,.g3{grid-template-columns:1fr}main{padding:22px 15px 60px}
  .topbar{padding:0 15px}.tiles{grid-template-columns:1fr 1fr;gap:12px}
  .tile{padding:17px}.tile .big{font-size:18px;top:16px;right:17px}
  th,td{padding:11px 13px}}
</style>
</head>
<body>

<!-- ════ sign in ════ -->
<div id="login">
  <div class="login-card">
    <div class="login-mark">CR</div>
    <h1>Captured Reality</h1>
    <p class="sub">Sign in to the Suite</p>
    <label for="li-email">Email</label>
    <input id="li-email" type="email" autocomplete="username" placeholder="you@capturedrealitybz.com">
    <label for="li-pass" style="margin-top:14px">Password</label>
    <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="go" id="li-go">Sign in</button>
    <div class="login-err" id="li-err"></div>
  </div>
</div>

<!-- ════ app ════ -->
<div id="app">
  <header class="topbar">
    <div class="mark">CR</div>
    <div class="name" id="brand">Captured Reality<span>Suite</span></div>
    <div class="sp"></div>
    <button class="homebtn" id="homebtn">‹ Home</button>
    <div class="userchip" id="userchip">
      <div class="av" id="av">M</div>
      <div class="u" id="who">—<span id="whorole"></span></div>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Captured Reality Suite — application logic
   ══════════════════════════════════════════════════════════════ */
(function(){
"use strict";

var CFG = window.CR_CONFIG || {
  url: "https://ingmeiuhlgmjbhnrkxou.supabase.co",
  key: "sb_publishable_Sz69BR0AAqaKktcaUWoK-w_FyXld7ut"
};

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

if(!window.supabase){
  $('#li-err').textContent = 'Could not load the database library. Keep this file in the captured-reality-hub folder.';
  return;
}

/* Artifact sandboxes have no localStorage. Fall back to an in-memory
   store so signing in still works — it just won't be remembered. */
var canStore = (function(){
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }
})();
var memStore = (function(){
  var m = {};
  return { getItem:function(k){ return k in m ? m[k] : null; },
           setItem:function(k,v){ m[k]=String(v); },
           removeItem:function(k){ delete m[k]; } };
})();

var sb = window.supabase.createClient(CFG.url, CFG.key, {
  auth:{ persistSession:true, autoRefreshToken:true,
         storage: canStore ? window.localStorage : memStore }
});

/* ── state ─────────────────────────────────────────────────── */
var S = {
  user:null, profile:null, view:'home', sel:null,
  employees:[], clients:[], jobs:[], equipment:[], vehicles:[], materials:[],
  timesheets:[], costs:[], invoices:[], payments:[], expenses:[], payables:[],
  billing:[], quotes:[], incidents:[], pl:[], settings:{}
};
window.__S = S; window.__sb = sb;

/* ── helpers ───────────────────────────────────────────────── */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(n,cur){
  return (cur==='USD'?'US$':'BZ$') +
    Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function money0(n,cur){
  return (cur==='USD'?'US$':'BZ$') +
    Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
}
function num(n,d){
  return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?2:d});
}
function dt(d){ return d ? new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function today(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000); }
function tc(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}); }
function initials(n){
  return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
}

function toast(msg, err){
  var t = document.createElement('div');
  t.className = 'toast'+(err?' err':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0';
    setTimeout(function(){ t.remove(); },320); }, err?5200:2600);
}

var PILL = {
  'Completed':'p-ok','paid':'p-ok','approved':'p-ok','in_service':'p-ok','present':'p-ok','accepted':'p-ok',
  'In Progress':'p-info','sent':'p-info','invoiced':'p-info','Submitted':'p-info','partly_paid':'p-info',
  'Corrections Required':'p-bad','out_of_service':'p-bad','overdue':'p-bad','absent':'p-bad','rejected':'p-bad',
  'in_shop':'p-warn','Submitted / Awaiting SSN':'p-warn','Open':'p-warn','open':'p-warn','disputed':'p-warn',
  'draft':'p-mute','unbilled':'p-mute','Not Started':'p-mute','retired':'p-mute','Cancelled':'p-mute'
};
function pill(s){ return '<span class="pill '+(PILL[s]||'p-mute')+'">'+esc(tc(s))+'</span>'; }

function fail(where, e){
  if(!e) return false;
  console.error('[Suite] '+where, e);
  toast(where+': '+(e.message||e), true);
  return true;
}
async function pull(table, order, asc){
  var q = sb.from(table).select('*');
  if(order) q = q.order(order,{ascending:asc!==false});
  var r = await q;
  if(fail('Loading '+table, r.error)) return [];
  return r.data||[];
}
async function save(table, row, id){
  var r = id ? await sb.from(table).update(row).eq('id',id).select().single()
             : await sb.from(table).insert(row).select().single();
  if(fail('Saving to '+table, r.error)) return null;
  return r.data;
}
async function del(table, id){
  var r = await sb.from(table).delete().eq('id',id);
  return !fail('Deleting from '+table, r.error);
}

async function loadAll(){
  var r = await Promise.all([
    pull('employees','display_name'), pull('clients','name'), pull('jobs','job_number',false),
    pull('equipment','eid'), pull('vehicles','vid'), pull('materials','name'),
    pull('timesheet_entries','entry_date',false), pull('cost_entries','entry_date',false),
    pull('invoices','issued_date',false), pull('payments','paid_date',false),
    pull('expenses','expense_date',false), pull('payables','due_date'),
    pull('billing_stages','seq'), pull('quotes','created_at',false),
    pull('incidents','incident_date',false), pull('job_profit_loss'), pull('app_settings')
  ]);
  S.employees=r[0]; S.clients=r[1]; S.jobs=r[2]; S.equipment=r[3]; S.vehicles=r[4];
  S.materials=r[5]; S.timesheets=r[6]; S.costs=r[7]; S.invoices=r[8]; S.payments=r[9];
  S.expenses=r[10]; S.payables=r[11]; S.billing=r[12]; S.quotes=r[13]; S.incidents=r[14]; S.pl=r[15];
  S.settings={}; (r[16]||[]).forEach(function(x){ S.settings[x.key]=x.value; });
}
window.__reload = async function(){ await loadAll(); render(); };

function empName(id){ var e=S.employees.find(function(x){return x.id===id;}); return e?e.display_name:'—'; }
function jobOf(id){ return S.jobs.find(function(x){return x.id===id;}); }
function jobLabel(id){ var j=jobOf(id); return j?(j.job_number+' · '+j.title):'—'; }
function plOf(id){ return S.pl.find(function(x){return x.job_id===id;})||{}; }
function clientName(id){ var c=S.clients.find(function(x){return x.id===id;}); return c?c.name:null; }

/* ── alerts (shared by home) ───────────────────────────────── */
function alerts(){
  var a = [];
  S.jobs.forEach(function(j){
    if(j.status==='Completed'||j.status==='Cancelled') return;
    var d = daysUntil(j.due_date);
    if(d!==null && d<0) a.push({t:'bad', n:Math.abs(d)+'d overdue', m:j.job_number+' · '+j.title, go:['jobs',j.id]});
    else if(d!==null && d<=7) a.push({t:'warn', n:'Due in '+d+'d', m:j.job_number+' · '+j.title, go:['jobs',j.id]});
  });
  S.employees.forEach(function(e){
    var d = daysUntil(e.dl_expiry);
    if(d!==null && d<0) a.push({t:'bad', n:'Licence expired', m:e.display_name, go:['crew',null]});
    else if(d!==null && d<=30) a.push({t:'warn', n:'Licence expires in '+d+'d', m:e.display_name, go:['crew',null]});
  });
  S.equipment.filter(function(x){return x.status==='out_of_service';}).forEach(function(x){
    a.push({t:'bad', n:'Out of service', m:x.eid+' · '+(x.name||'unnamed'), go:['equip',null]});
  });
  S.vehicles.filter(function(x){return x.status!=='in_service';}).forEach(function(x){
    a.push({t:'bad', n:tc(x.status), m:(x.vid||'')+' · '+x.name, go:['veh',null]});
  });
  S.invoices.forEach(function(i){
    var d = daysUntil(i.due_date);
    if(i.status!=='paid'&&i.status!=='cancelled'&&d!==null&&d<0)
      a.push({t:'bad', n:'Invoice overdue', m:(i.invoice_number||'—'), go:['money',null]});
  });
  S.payables.forEach(function(p){
    var d = daysUntil(p.due_date);
    if(p.status!=='paid'&&p.status!=='cancelled'&&d!==null&&d<0)
      a.push({t:'bad', n:'Bill overdue', m:p.vendor, go:['exp',null]});
  });
  S.incidents.filter(function(i){return i.status==='Open';}).forEach(function(i){
    a.push({t:'warn', n:'Open incident', m:i.title, go:['home',null]});
  });
  return a;
}

/* ══════════════════════════════════════════════════════════════
   Routing
   ══════════════════════════════════════════════════════════════ */
var VIEWS = {}, TITLES = {
  home:'Home', jobs:'Jobs', clients:'Clients', crew:'Crew', time:'Timesheets',
  pay:'Payroll', equip:'Equipment', veh:'Vehicles', money:'Money', exp:'Expenses', rep:'Reports'
};

function go(v, sel){
  S.view = v; S.sel = sel||null;
  $('#homebtn').classList.toggle('on', v!=='home');
  render();
  window.scrollTo(0,0);
}
function render(){
  $('#main').innerHTML = (VIEWS[S.view]||VIEWS.home)();
  if(VIEWS[S.view+'_after']) VIEWS[S.view+'_after']();
  $$('[data-go]').forEach(function(el){
    el.onclick = function(){ var p = el.dataset.go.split('|'); go(p[0], p[1]||null); };
  });
}

/* ── page header helper ────────────────────────────────────── */
function phead(title, sub, action){
  return '<div class="phead"><div><h1>'+esc(title)+'</h1>'+
    (sub?'<p>'+esc(sub)+'</p>':'')+'</div><div class="sp"></div>'+(action||'')+'</div>';
}
function card(title, cnt, body, tools){
  return '<div class="card">'+
    (title?'<div class="card-h"><h3>'+esc(title)+'</h3>'+
      (cnt?'<span class="cnt">'+esc(cnt)+'</span>':'')+'<div class="sp"></div>'+(tools||'')+'</div>':'')+
    body+'</div>';
}
function tbl(cols, rows, emptyMsg, emptyIcon){
  if(!rows.length) return '<div class="empty"><div class="big">'+(emptyIcon||'○')+'</div>'+esc(emptyMsg||'Nothing here yet.')+'</div>';
  return '<div class="tw"><table><thead><tr>'+
    cols.map(function(c){ return '<th'+(c.num?' class="num"':'')+'>'+esc(c.t)+'</th>'; }).join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function stat(l, v, f, cls){
  return '<div class="stat'+(cls?' '+cls:'')+'"><div class="l">'+esc(l)+'</div>'+
    '<div class="v money">'+esc(v)+'</div>'+(f?'<div class="f">'+esc(f)+'</div>':'')+'</div>';
}

/* ── modal ─────────────────────────────────────────────────── */
function openModal(title, body, footer, wide){
  $('#modal-box').className = 'modal-box'+(wide?' wide':'');
  $('#modal-box').innerHTML =
    '<div class="modal-h"><h3>'+esc(title)+'</h3><button data-x>&times;</button></div>'+
    '<div class="modal-b">'+body+'</div>'+
    (footer?'<div class="modal-f">'+footer+'</div>':'');
  $('#modal').classList.add('on');
  $('#modal-box [data-x]').onclick = closeModal;
}
function closeModal(){ $('#modal').classList.remove('on'); $('#modal-box').innerHTML=''; }
$('#modal').addEventListener('mousedown', function(e){ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

function formData(){
  var o = {};
  $$('#modal-box [name]').forEach(function(el){
    var v = el.type==='checkbox' ? el.checked : el.value;
    if(typeof v==='string'){ v=v.trim(); if(v==='') v=null; }
    if(el.dataset.type==='num') v = (v===null?null:Number(v));
    o[el.name] = v;
  });
  return o;
}
function fld(label, name, o){
  o = o||{};
  var v = o.value==null?'':o.value;
  var a = 'name="'+name+'"'+(o.num?' data-type="num"':'')+
          (o.step?' step="'+o.step+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'');
  var inp;
  if(o.options){
    inp = '<select '+a+'>'+o.options.map(function(x){
      var val = (typeof x==='object')?x.v:x, lab = (typeof x==='object')?x.t:tc(x);
      return '<option value="'+esc(val==null?'':val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lab)+'</option>';
    }).join('')+'</select>';
  } else if(o.area){
    inp = '<textarea '+a+' rows="'+(o.rows||3)+'">'+esc(v)+'</textarea>';
  } else if(o.check){
    inp = '<input type="checkbox" '+a+(v?' checked':'')+'>';
  } else {
    inp = '<input type="'+(o.type||'text')+'" '+a+' value="'+esc(v)+'">';
  }
  return '<div class="field"><label>'+esc(label)+'</label>'+inp+
    (o.hint?'<div class="hint">'+esc(o.hint)+'</div>':'')+'</div>';
}
function jobOpts(blank){
  var o = blank===false?[]:[{v:'',t:'— none —'}];
  return o.concat(S.jobs.map(function(j){ return {v:j.id,t:j.job_number+' · '+j.title}; }));
}
function empOpts(blank){
  var o = blank===false?[]:[{v:'',t:'— none —'}];
  return o.concat(S.employees.filter(function(e){return e.active;})
    .map(function(e){ return {v:e.id,t:e.display_name}; }));
}
function clientOpts(){
  return [{v:'',t:'— none —'}].concat(S.clients.map(function(c){ return {v:c.id,t:c.name}; }));
}
var CUR = [{v:'BZD',t:'Belize Dollars (BZ$)'},{v:'USD',t:'US Dollars (US$)'}];

/* ══════════════════════════════════════════════════════════════
   Sign in
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  var g = await sb.auth.getUser();
  S.user = (g.data&&g.data.user)||null;
  if(!S.user){ $('#login').classList.remove('hidden'); return; }
  var p = await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile = p.data||null;
  var nm = (S.profile&&S.profile.name)||S.user.email;
  $('#login').classList.add('hidden');
  $('#app').classList.add('on');
  $('#av').textContent = initials(nm);
  $('#who').childNodes[0].nodeValue = nm.split(' ')[0];
  $('#whorole').textContent = (S.profile&&S.profile.role==='admin')?'Administrator':'Member';
  await loadAll();
  go('home');
}

$('#li-go').onclick = async function(){
  var em = $('#li-email').value.trim(), pw = $('#li-pass').value;
  if(!em||!pw){ $('#li-err').textContent='Enter your email and password.'; return; }
  $('#li-go').disabled = true; $('#li-err').textContent = 'Signing in…';
  var r = await sb.auth.signInWithPassword({email:em,password:pw});
  $('#li-go').disabled = false;
  if(r.error){ $('#li-err').textContent = r.error.message; return; }
  $('#li-err').textContent = '';
  boot();
};

VIEWS.home = function(){
  var hr = new Date().getHours();
  var greet = hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  var nm = ((S.profile&&S.profile.name)||'there').split(' ')[0];

  var active = S.jobs.filter(function(j){
    return j.contract_type!=='internal' && j.status!=='Completed' && j.status!=='Cancelled';
  });
  var collected = S.pl.reduce(function(a,p){ return a+Number(p.collected||0); },0);
  var invoiced  = S.pl.reduce(function(a,p){ return a+Number(p.invoiced_incl_gst||0); },0);
  var jobCost   = S.pl.reduce(function(a,p){ return a+Number(p.total_cost||0); },0);
  var overhead  = S.expenses.reduce(function(a,e){ return a+Number(e.amount||0); },0);
  var net = collected - jobCost - overhead;
  var owed = S.payables.filter(function(p){return p.status!=='paid'&&p.status!=='cancelled';})
                       .reduce(function(a,p){ return a+Number(p.amount||0)-Number(p.paid_amount||0); },0);
  var weekAgo = new Date(Date.now()-6*86400000).toISOString().slice(0,10);
  var weekDays = S.timesheets.filter(function(t){ return t.entry_date>=weekAgo; })
                             .reduce(function(a,t){ return a+Number(t.days_worked||0); },0);

  var al = alerts();
  var alertHtml = al.length
    ? '<div class="alertbar">'+al.slice(0,7).map(function(a){
        return '<button class="alert '+a.t+'" data-go="'+a.go[0]+(a.go[1]?'|'+a.go[1]:'')+'">'+
               '<b>'+esc(a.n)+'</b> '+esc(a.m)+'</button>';
      }).join('')+
      (al.length>7?'<span class="alert ok">+'+(al.length-7)+' more</span>':'')+'</div>'
    : '<div class="alertbar"><span class="alert ok"><b>All clear</b> nothing needs attention</span></div>';

  var counts = {
    jobs: active.length+' active',
    crew: S.employees.filter(function(e){return e.active;}).length+' people',
    time: num(weekDays,1)+' days this week',
    pay:  'Weekly & biweekly',
    equip: S.equipment.length+' items',
    veh:  S.vehicles.length+' vehicles',
    money: money0(invoiced-collected)+' outstanding',
    exp:  overhead? money0(overhead)+' overhead' : 'None recorded yet',
    clients: S.clients.length+' clients',
    rep:  money0(net)+' net'
  };
  var bigs = {
    jobs: String(active.length), crew: String(S.employees.filter(function(e){return e.active;}).length),
    equip: String(S.equipment.length), veh: String(S.vehicles.length),
    clients: String(S.clients.length)
  };

  return '<div class="hello">'+esc(greet)+', '+esc(nm)+'</div>'+
    '<div class="hello-sub">'+active.length+' job'+(active.length===1?'':'s')+' running · '+
      money(collected)+' collected · '+money(net)+' net so far</div>'+
    alertHtml+
    '<div class="tiles">'+TILES.map(function(t){
      return '<button class="tile" data-go="'+t.k+'">'+
        (bigs[t.k]?'<div class="big">'+esc(bigs[t.k])+'</div>':'')+
        '<div class="ic '+t.c+'">'+t.ic+'</div>'+
        '<div class="t">'+esc(t.t)+'</div>'+
        '<div class="n">'+esc(counts[t.k]||t.d)+'</div></button>';
    }).join('')+'</div>';
};

function jobPage(id){
  var j = jobOf(id); if(!j) return '<div class="empty">That job could not be found.</div>';
  var p = plOf(id), gstF = 1+Number(j.gst_pct||0)/100, fee = Number(j.contracted_fee||0);

  var stages = S.billing.filter(function(b){return b.job_id===id;}).sort(function(a,b){return a.seq-b.seq;});
  var stageRows = stages.map(function(s){
    var base = s.amount!=null?Number(s.amount):fee*Number(s.pct||0)/100;
    return '<tr><td>'+esc(s.label)+'</td><td class="num mut">'+(s.amount!=null?'—':num(s.pct,1)+'%')+'</td>'+
      '<td class="num money">'+money(base,j.currency)+'</td>'+
      '<td class="num money">'+money(base*gstF,j.currency)+'</td><td>'+pill(s.status)+'</td></tr>';
  });

  var ts = S.timesheets.filter(function(t){return t.job_id===id;});
  var tsRows = ts.slice(0,20).map(function(t){
    return '<tr><td class="mut">'+dt(t.entry_date)+'</td><td>'+esc(empName(t.employee_id))+'</td>'+
      '<td class="mut">'+esc(tc(t.work_type))+'</td><td class="num">'+num(t.days_worked,2)+'</td>'+
      '<td class="num money">'+money(t.labour_cost,j.currency)+'</td></tr>';
  });

  var costs = S.costs.filter(function(c){return c.job_id===id;});
  var costRows = costs.map(function(c){
    return '<tr><td class="mut">'+dt(c.entry_date)+'</td><td>'+esc(c.cost_type)+'</td>'+
      '<td class="mut">'+esc(String(c.item||c.notes||'—').slice(0,70))+'</td>'+
      '<td class="num money">'+money(c.amount,c.currency)+'</td></tr>';
  });

  var invs = S.invoices.filter(function(i){return i.job_id===id;});
  var invRows = invs.map(function(i){
    var paid = S.payments.filter(function(x){return x.invoice_id===i.id;})
                         .reduce(function(a,x){return a+Number(x.amount||0);},0);
    return '<tr><td><b>'+esc(i.invoice_number||'—')+'</b></td><td class="mut">'+dt(i.issued_date)+'</td>'+
      '<td class="num money">'+money(i.total_amount,i.currency)+'</td>'+
      '<td class="num money">'+money(paid,i.currency)+'</td><td>'+pill(i.status)+'</td></tr>';
  });

  function row(l,v){ return v==null||v===''?'':'<dt>'+esc(l)+'</dt><dd>'+v+'</dd>'; }

  return phead(j.job_number+' · '+j.title, j.client_name||clientName(j.client_id)||'',
      '<button class="btn ghost" id="back-jobs">‹ All jobs</button> '+
      '<button class="btn" id="edit-job">Edit job</button>')+
    '<div class="stats">'+
      stat('Contracted', money(p.contracted_incl_gst,j.currency),'incl. GST')+
      stat('Invoiced', money(p.invoiced_incl_gst,j.currency))+
      stat('Collected', money(p.collected,j.currency),'','ok')+
      stat('Total cost', money(p.total_cost,j.currency))+
      stat('Net', money(p.net_realised,j.currency),'collected − cost',
           Number(p.net_realised||0)>=0?'ok':'bad')+
    '</div>'+
    '<div class="split"><div>'+
      card('Job details',null,'<div class="card-b"><dl class="dl">'+
        row('Status', pill(j.status))+ row('Field work', pill(j.field_status))+
        row('Drafting', pill(j.cad_status))+ row('Type', esc(j.job_type))+
        row('Contract', esc(tc(j.contract_type)))+ row('Priority', esc(j.priority))+
        row('Location', esc(j.location))+ row('Drawing', esc(j.drawing_name))+
        row('Surveyor', j.surveyor_id?esc(empName(j.surveyor_id)):null)+
        row('Technician', j.technician_id?esc(empName(j.technician_id)):null)+
        row('Start', j.start_date?dt(j.start_date):null)+
        row('Due', j.due_date?dt(j.due_date):null)+
        row('Delivered', j.delivered_date?dt(j.delivered_date):null)+
        row('Folder', esc(j.onedrive_path))+
        row('Legacy code', esc(j.legacy_code))+
      '</dl></div>')+
      card('Parcel & legal',null,'<div class="card-b"><dl class="dl">'+
        row('Parcel / lot no.', esc(j.parcel_no))+ row('Block', esc(j.block))+
        row('Registration section', esc(j.registration_section))+ row('Locality', esc(j.locality))+
        row('Area', j.area_value?esc(num(j.area_value,4)+' '+tc(j.area_unit||'')):null)+
      '</dl>'+ (!j.parcel_no&&!j.locality?'<div class="hint">Not recorded yet — use Edit job to add it.</div>':'')+'</div>')+
      card('Lands Department',null,'<div class="card-b"><dl class="dl">'+
        row('Survey serial', esc(j.survey_serial))+ row('Entry no.', esc(j.entry_no))+
        row('Submitted', j.submission_date?dt(j.submission_date):null)+
        row('Authenticated', esc(j.authenticated))+ row('Corrections', esc(j.corrections))+
        row('Printed', esc(j.printed))+
      '</dl>'+ (!j.survey_serial?'<div class="hint">Nothing filed yet.</div>':'')+'</div>')+
    '</div><div>'+
      card('What it cost',null,'<div class="card-b"><table><tbody>'+
        [['Labour',p.labour_cost],['Allowances',p.allowance_cost],['Equipment',p.equipment_cost],
         ['Vehicles',p.vehicle_cost],['Materials & other',p.other_cost]].map(function(x){
          return '<tr><td class="mut">'+x[0]+'</td><td class="num money">'+money(x[1],j.currency)+'</td></tr>';
        }).join('')+
        '<tr><td><b>Total</b></td><td class="num money"><b>'+money(p.total_cost,j.currency)+'</b></td></tr>'+
      '</tbody></table></div>')+
      card('Billing stages', stages.length?stages.length+' stages':'', tbl(
        [{t:'Stage'},{t:'%',num:1},{t:'Ex-GST',num:1},{t:'Incl. GST',num:1},{t:'Status'}],
        stageRows,'No billing plan set up for this job.','◆'))+
      card('Invoices', invs.length?invs.length:'', tbl(
        [{t:'Invoice'},{t:'Issued'},{t:'Total',num:1},{t:'Paid',num:1},{t:'Status'}],
        invRows,'Nothing invoiced yet.','◆'))+
      card('Labour logged', ts.length?ts.length+' entries':'', tbl(
        [{t:'Date'},{t:'Who'},{t:'Work'},{t:'Days',num:1},{t:'Cost',num:1}],
        tsRows,'No hours logged against this job.','◷'))+
      card('Other costs', costs.length?costs.length:'', tbl(
        [{t:'Date'},{t:'Type'},{t:'Detail'},{t:'Amount',num:1}],
        costRows,'No materials or other costs.','◇'))+
    '</div></div>';
}

function previewPayroll(){
  var type=$('#pr-type').value, from=$('#pr-from').value, to=$('#pr-to').value;
  if(!from||!to) return;
  var lines = S.employees.filter(function(e){return e.active&&e.pay_period===type;}).map(function(e){
    var ts = S.timesheets.filter(function(t){
      return t.employee_id===e.id && t.entry_date>=from && t.entry_date<=to;
    });
    var w = ts.filter(function(t){return t.attendance==='present';});
    return {e:e,
      days:w.reduce(function(a,t){return a+Number(t.days_worked||0);},0),
      base:w.reduce(function(a,t){return a+Number(t.labour_cost||0);},0),
      trav:w.reduce(function(a,t){return a+Number(t.travel_allowance||0);},0),
      meal:w.reduce(function(a,t){return a+Number(t.meal_allowance||0);},0),
      off:ts.filter(function(t){return t.attendance!=='present';}).length};
  }).filter(function(l){return l.days>0||l.off>0;});
  lines.forEach(function(l){ l.gross = l.base+l.trav+l.meal; });
  var gross = lines.reduce(function(a,l){return a+l.gross;},0);

  if(!lines.length){
    $('#pr-out').innerHTML = card(null,null,'<div class="empty"><div class="big">◈</div>'+
      'Nobody on the '+esc(type)+' cycle logged time between '+esc(dt(from))+' and '+esc(dt(to))+'.</div>');
    return;
  }
  var rows = lines.map(function(l){
    return '<tr><td><div class="stack"><b>'+esc(l.e.display_name)+'</b><span>'+esc(l.e.job_title||'')+'</span></div></td>'+
      '<td class="num">'+num(l.days,2)+'</td>'+
      '<td class="num money mut">'+money(l.e.daily_rate)+'</td>'+
      '<td class="num money">'+money(l.base)+'</td>'+
      '<td class="num money">'+money(l.trav)+'</td>'+
      '<td class="num money">'+money(l.meal)+'</td>'+
      '<td class="num mut">'+(l.off||'—')+'</td>'+
      '<td class="num money"><b>'+money(l.gross)+'</b></td></tr>';
  });
  $('#pr-out').innerHTML =
    '<div class="stats">'+
      stat('People', String(lines.length), tc(type)+' cycle')+
      stat('Days', num(lines.reduce(function(a,l){return a+l.days;},0),2))+
      stat('Total pay', money(gross),'', 'teal')+
    '</div>'+
    card(dt(from)+' to '+dt(to), null,
      tbl([{t:'Person'},{t:'Days',num:1},{t:'Rate',num:1},{t:'Base pay',num:1},
           {t:'Travel',num:1},{t:'Meals',num:1},{t:'Off',num:1},{t:'Gross',num:1}], rows),
      '<button class="btn ghost sm" id="pr-print">Print timesheets</button> '+
      '<button class="btn sm" id="pr-save">Save pay run</button>');

  $('#pr-save').onclick = async function(){
    var per = await save('payroll_periods',{period_type:type,start_date:from,end_date:to,status:'draft'});
    if(!per) return;
    var r = await sb.from('payroll_lines').insert(lines.map(function(l){
      return {period_id:per.id, employee_id:l.e.id, days_worked:l.days, daily_rate:l.e.daily_rate,
              base_pay:l.base, travel_total:l.trav, meal_total:l.meal, other_pay:0, deductions:0};
    }));
    if(fail('Saving the pay run', r.error)) return;
    toast('Pay run saved — '+money(gross)+' for '+lines.length+' people');
  };
  $('#pr-print').onclick = function(){ printTimesheets(type, from, to, lines); };
}

function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function download(name, text, mime){
  var b = new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function exportEquipCsv(){
  var lines = [['EquipmentID','Equipment','Category','Brand','SerialNumber','Condition','ServiceStatus','Cost_BZD','Notes'].map(csvCell).join(',')];
  S.equipment.slice().sort(function(a,b){
    return (a.category||'')===(b.category||'')?(a.eid<b.eid?-1:1):((a.category||'')<(b.category||'')?-1:1);
  }).forEach(function(e){
    lines.push([e.eid,e.name,e.category,e.brand,e.serial,e.condition,tc(e.status),
                Number(e.cost||0),e.notes].map(csvCell).join(','));
  });
  download('captured-reality-equipment-'+today()+'.csv','﻿'+lines.join('\r\n'),'text/csv');
  toast('CSV downloaded');
}

VIEWS.money = function(){

                           .reduce(function(a,i){return a+Number(i.total_amount||0);},0);

  var invRows = S.invoices.map(function(i){
    var paid = paidOn(i), bal = Number(i.total_amount||0)-paid, d = daysUntil(i.due_date);

      '<td class="num money">'+money(paid,i.currency)+'</td>'+
      '<td class="num money '+(bal>0.005?'neg':'')+'">'+money(bal,i.currency)+'</td>'+
      '<td>'+(late?'<span class="pill p-bad">Overdue</span>':pill(i.status))+'</td></tr>';
  });
  var payRows = S.payments.slice(0,25).map(function(p){
    var i = S.invoices.find(function(x){return x.id===p.invoice_id;})||{};
    return '<tr><td class="mut">'+(p.paid_date?dt(p.paid_date):'<span class="mut">not recorded</span>')+'</td>'+

  return phead('Money','Quotes, invoices and what has actually come in',
      '<button class="btn ghost" id="new-quote">+ Quote</button> '+
      '<button class="btn big" id="new-inv">+ Invoice</button>')+
    '<div class="stats">'+
      stat('Invoiced', money(invoiced),'incl. GST')+
      stat('Collected', money(collected),'','ok')+
      stat('Outstanding', money(invoiced-collected),'', (invoiced-collected)>0.005?'warn':'')+
      stat('Quotes out', String(S.quotes.filter(function(q){return q.status==='sent';}).length))+

    card('Invoices', S.invoices.length, tbl(
      [{t:'Invoice'},{t:'Job'},{t:'Issued'},{t:'Ex-GST',num:1},{t:'GST',num:1},
       {t:'Total',num:1},{t:'Paid',num:1},{t:'Balance',num:1},{t:'Status'}],
      invRows,'No invoices yet.','◆'))+
    '<div class="split">'+
      card('Payments received', S.payments.length, tbl(
        [{t:'Date'},{t:'Invoice'},{t:'Job'},{t:'How'},{t:'Ref'},{t:'Amount',num:1}],

    fld('Valid until','valid_until',{value:q.valid_until, type:'date'})+
  '</div>'+ fld('Notes','notes',{value:q.notes, area:1, rows:2});
  openModal(q.id?'Edit quote':'New quote', body,
    (q.id?'<button class="btn danger" id="qq-del">Delete</button>':'')+'<div class="sp"></div>'+
    '<button class="btn ghost" id="qq-cancel">Cancel</button><button class="btn" id="qq-save">Save</button>');
  $('#qq-cancel').onclick = closeModal;
  if($('#qq-del')) $('#qq-del').onclick = async function(){
    if(await del('quotes', q.id)){ closeModal(); toast('Deleted'); await __reload(); }
  };
  $('#qq-save').onclick = async function(){
    var d = formData();
    if(d.gst_pct==null) d.gst_pct=12.5;
    if(d.amount==null) d.amount=0;
    if(await save('quotes', d, q.id)){ closeModal(); toast('Quote saved'); await __reload(); }
  };
}

/* ══════════════════════════════════════════════════════════════
   EXPENSES
   ══════════════════════════════════════════════════════════════ */
var EXP_CATS = ['rent','insurance','software','utilities','electricity','water','internet','fuel',
                'vehicle','office','government_fees','marketing','professional_fees','bank_charges','other'];

VIEWS.exp = function(){
  var total = S.expenses.reduce(function(a,e){return a+Number(e.amount||0);},0);
  var owed = S.payables.filter(function(p){return p.status!=='paid'&&p.status!=='cancelled';})
                       .reduce(function(a,p){return a+Number(p.amount||0)-Number(p.paid_amount||0);},0);
  var byCat = {};
  S.expenses.forEach(function(e){ byCat[e.category]=(byCat[e.category]||0)+Number(e.amount||0); });
  var catRows = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).map(function(c){
    var pct = total?byCat[c]/total*100:0;
    return '<tr><td>'+esc(tc(c))+'</td>'+
      '<td style="width:42%"><div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div></td>'+
      '<td class="num money">'+money(byCat[c])+'</td><td class="num mut">'+pct.toFixed(0)+'%</td></tr>';
  });
  var expRows = S.expenses.map(function(e){
    return '<tr class="click" data-exp="'+e.id+'">'+
      '<td class="mut">'+dt(e.expense_date)+'</td><td>'+esc(tc(e.category))+'</td>'+
      '<td class="mut">'+esc(e.description||'—')+'</td><td class="mut">'+esc(e.vendor||'—')+'</td>'+
      '<td class="num money">'+money(e.amount,e.currency)+'</td></tr>';
  });
  var billRows = S.payables.map(function(p){
    var d = daysUntil(p.due_date);
    var late = d!==null&&d<0&&p.status!=='paid'&&p.status!=='cancelled';
    return '<tr class="click" data-bill="'+p.id+'">'+
      '<td><b>'+esc(p.vendor)+'</b></td><td class="mut">'+esc(p.description||'—')+'</td>'+
      '<td class="mut">'+dt(p.due_date)+'</td>'+
      '<td class="num money">'+money(p.amount,p.currency)+'</td>'+
      '<td class="num money">'+money(p.paid_amount,p.currency)+'</td>'+
      '<td>'+(late?'<span class="pill p-bad">Overdue</span>':pill(p.status))+'</td></tr>';
  });

  return phead('Expenses','Running costs that are not tied to any one job',
      '<button class="btn ghost" id="new-bill">+ Bill to pay</button> '+
      '<button class="btn big" id="new-exp">+ Expense</button>')+
    '<div class="stats">'+
      stat('Overhead', money(total), S.expenses.length+' entries','teal')+
      stat('Bills owed', money(owed),'', owed>0?'warn':'')+
      stat('Open bills', String(S.payables.filter(function(p){return p.status!=='paid'&&p.status!=='cancelled';}).length))+
    '</div>'+
    '<div class="split">'+
      card('Where it goes',null, tbl([{t:'Category'},{t:''},{t:'Amount',num:1},{t:'Share',num:1}], catRows,
        'Nothing recorded yet. Rent, insurance, software and utilities belong here — without them your reports show job margins, not company profit.','◇'))+
      card('Bills to pay', S.payables.length, tbl(
        [{t:'Vendor'},{t:'For'},{t:'Due'},{t:'Amount',num:1},{t:'Paid',num:1},{t:'Status'}],
        billRows,'Nothing owing.','◇'))+
    '</div>'+
    card('All expenses', S.expenses.length, tbl(
      [{t:'Date'},{t:'Category'},{t:'What for'},{t:'Paid to'},{t:'Amount',num:1}],
      expRows,'No expenses yet.','◇'));
};
VIEWS.exp_after = function(){
  $('#new-exp').onclick = function(){ expForm(); };
  $('#new-bill').onclick = function(){ billForm(); };
  $$('[data-exp]').forEach(function(tr){
    tr.onclick = function(){ expForm(S.expenses.find(function(x){return x.id===tr.dataset.exp;})); };
  });
  $$('[data-bill]').forEach(function(tr){
    tr.onclick = function(){ billForm(S.payables.find(function(x){return x.id===tr.dataset.bill;})); };
  });
};

function expForm(e){
  e = e||{};
  var body = '<div class="g2">'+
    fld('Date','expense_date',{value:e.expense_date||today(), type:'date'})+
    fld('Category','category',{value:e.category||'other', options:EXP_CATS})+
    fld('Amount','amount',{value:e.amount, num:1, step:'0.01'})+
    fld('Currency','currency',{value:e.currency||'BZD', options:CUR})+
    fld('Paid to','vendor',{value:e.vendor})+
    fld('Invoice no.','invoice_no',{value:e.invoice_no})+
    fld('Happens every month','recurring',{value:e.recurring, check:1})+
  '</div>'+ fld('What for','description',{value:e.description, ph:'Office rent — August'})+
  fld('Notes','notes',{value:e.notes, area:1, rows:2});
  openModal(e.id?'Edit expense':'New expense', body,
    (e.id?'<button class="btn danger" id="x-del">Delete</button>':'')+'<div class="sp"></div>'+
    '<button class="btn ghost" id="x-cancel">Cancel</button><button class="btn" id="x-save">Save</button>');
  $('#x-cancel').onclick = closeModal;
  if($('#x-del')) $('#x-del').onclick = async function(){
    if(await del('expenses', e.id)){ closeModal(); toast('Deleted'); await __reload(); }
  };
  $('#x-save').onclick = async function(){
    var d = formData();
    if(d.amount==null){ toast('Enter the amount.', true); return; }
    if(await save('expenses', d, e.id)){ closeModal(); toast('Expense saved'); await __reload(); }
  };
}

function billForm(b){
  b = b||{};
  var body = '<div class="g2">'+
    fld('Who you owe','vendor',{value:b.vendor})+
    fld('Job (if any)','job_id',{value:b.job_id, options:jobOpts()})+
    fld('Amount','amount',{value:b.amount, num:1, step:'0.01'})+
    fld('Currency','currency',{value:b.currency||'BZD', options:CUR})+
    fld('Issued','issued_date',{value:b.issued_date||today(), type:'date'})+
    fld('Due','due_date',{value:b.due_date, type:'date'})+
    fld('Status','status',{value:b.status||'open', options:[
      {v:'open',t:'Open'},{v:'partly_paid',t:'Partly paid'},{v:'paid',t:'Paid'},
      {v:'disputed',t:'Disputed'},{v:'cancelled',t:'Cancelled'}]})+
    fld('Paid so far','paid_amount',{value:b.paid_amount||0, num:1, step:'0.01'})+
    fld('Paid on','paid_date',{value:b.paid_date, type:'date'})+
    fld('Invoice no.','invoice_no',{value:b.invoice_no})+
  '</div>'+ fld('What for','description',{value:b.description})+
  fld('Notes','notes',{value:b.notes, area:1, rows:2});
  openModal(b.id?'Edit bill':'New bill', body,
    (b.id?'<button class="btn danger" id="b-del">Delete</button>':'')+'<div class="sp"></div>'+
    '<button class="btn ghost" id="b-cancel">Cancel</button><button class="btn" id="b-save">Save</button>');
  $('#b-cancel').onclick = closeModal;
  if($('#b-del')) $('#b-del').onclick = async function(){
    if(await del('payables', b.id)){ closeModal(); toast('Deleted'); await __reload(); }
  };
  $('#b-save').onclick = async function(){
    var d = formData();
    if(!d.vendor){ toast('Who do you owe?', true); return; }
    if(d.amount==null) d.amount=0;
    if(d.paid_amount==null) d.paid_amount=0;
    if(await save('payables', d, b.id)){ closeModal(); toast('Bill saved'); await __reload(); }
  };
}

/* ══════════════════════════════════════════════════════════════
   REPORTS
   ══════════════════════════════════════════════════════════════ */
VIEWS.rep = function(){
  var internal = function(p){ var j=jobOf(p.job_id); return j&&j.contract_type==='internal'; };
  var collected = S.pl.reduce(function(a,p){return a+Number(p.collected||0);},0);
  var invoiced  = S.pl.reduce(function(a,p){return a+Number(p.invoiced_incl_gst||0);},0);
  var jobCost   = S.pl.filter(function(p){return !internal(p);})
                      .reduce(function(a,p){return a+Number(p.total_cost||0);},0);
  var adminCost = S.pl.filter(internal).reduce(function(a,p){return a+Number(p.total_cost||0);},0);
  var overhead  = S.expenses.reduce(function(a,e){return a+Number(e.amount||0);},0);
  var net = collected - jobCost - adminCost - overhead;

  var rows = S.pl.slice().sort(function(a,b){
    return String(a.job_number)<String(b.job_number)?-1:1;
  }).map(function(p){
    var j = jobOf(p.job_id)||{};
    return '<tr class="click" data-go="jobs|'+p.job_id+'">'+
      '<td><div class="stack"><b>'+esc(p.job_number||'—')+'</b><span>'+esc(p.title||'')+'</span></div></td>'+
      '<td class="mut">'+esc(p.client_name||'—')+'</td>'+
      '<td>'+(j.contract_type==='internal'?'<span class="pill p-mute">Internal</span>':pill(p.status))+'</td>'+
      '<td class="num money">'+money(p.contracted_incl_gst,p.currency)+'</td>'+
      '<td class="num money">'+money(p.invoiced_incl_gst,p.currency)+'</td>'+
      '<td class="num money">'+money(p.collected,p.currency)+'</td>'+
      '<td class="num money">'+money(p.labour_cost,p.currency)+'</td>'+
      '<td class="num money">'+money(p.total_cost,p.currency)+'</td>'+
      '<td class="num money '+(Number(p.net_realised||0)>=0?'pos':'neg')+'"><b>'+money(p.net_realised,p.currency)+'</b></td></tr>';
  });

  var labour = S.timesheets.reduce(function(a,t){return a+Number(t.labour_cost||0);},0);
  var byP = {};
  S.timesheets.forEach(function(t){
    var k = empName(t.employee_id);
    byP[k] = byP[k]||{d:0,c:0};
    byP[k].d += Number(t.days_worked||0); byP[k].c += Number(t.labour_cost||0);
  });
  var crewRows = Object.keys(byP).sort(function(a,b){return byP[b].c-byP[a].c;}).map(function(k){
    var pct = labour?byP[k].c/labour*100:0;
    return '<tr><td><b>'+esc(k)+'</b></td><td class="num">'+num(byP[k].d,2)+'</td>'+
      '<td style="width:38%"><div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div></td>'+
      '<td class="num money">'+money(byP[k].c)+'</td></tr>';
  });

  return phead('Reports','What the business actually made',
      '<button class="btn ghost" id="rep-print">Print</button>')+
    '<div class="stats">'+
      stat('Collected', money(collected),'money in the bank','ok')+
      stat('Invoiced', money(invoiced),'incl. GST')+
      stat('Job costs', money(jobCost),'billable work')+
      stat('Admin costs', money(adminCost),'internal jobs')+
      stat('Overhead', money(overhead),'rent, insurance, utilities')+
      stat('Company net', money(net),'collected − every cost', net>=0?'ok':'bad')+
    '</div>'+
    card('Job by job',null, tbl([{t:'Job'},{t:'Client'},{t:'Status'},{t:'Contracted',num:1},
      {t:'Invoiced',num:1},{t:'Collected',num:1},{t:'Labour',num:1},{t:'Total cost',num:1},{t:'Net',num:1}],
      rows,'No jobs yet.','◨')+
      '<div class="card-b" style="padding-top:14px"><div class="hint">Net is what has actually been collected '+
      'less what the job cost. A job that is invoiced but unpaid shows the cost without the income until '+
      'the payment is recorded.</div></div>')+
    card('Who did the work', money(labour)+' of labour', tbl(
      [{t:'Person'},{t:'Days',num:1},{t:''},{t:'Cost',num:1}], crewRows,'No time logged.','◷'));
};
VIEWS.rep_after = function(){ $('#rep-print').onclick = function(){ window.print(); }; };

/* ── start ─────────────────────────────────────────────────── */
boot();

})();

</script>
